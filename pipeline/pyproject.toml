[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pipeline"
version = "0.1.0"
description = "Favorita → gold star schema for the Store Performance Cockpit"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "py7zr>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_pipeline = ["sql/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
